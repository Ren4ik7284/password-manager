<div class="saved-page">
  <div class="container">
    <div class="header">
      <h1>Сохраненные пароли</h1>
      <p>История сгенерированных паролей</p>
      <button class="clear-btn" (click)="clearAll()" *ngIf="passwords.length > 0">Очистить всё</button>
    </div>

    <div *ngIf="passwords.length === 0" class="empty">
      <p>Нет сохраненных паролей</p>
      <button class="generate-link" routerLink="/generator">Сгенерировать пароль</button>
    </div>

    <div class="passwords-list" *ngIf="passwords.length > 0">
      <div class="password-item" *ngFor="let item of passwords">
        <div class="password-info">
          <div class="password-value">
            <span class="password-text">{{ item.password }}</span>
            <button class="copy-btn" (click)="copyPassword(item.password, item.id)">
              {{ copiedId === item.id ? "Скопировано" : "Копировать" }}
            </button>
          </div>
          <div class="password-meta">
            <span class="date">Создан: {{ item.createdAt | date:"dd.MM.yyyy HH:mm" }}</span>
            <span class="strength">Надежность: {{ getStrengthText(item.password) }}</span>
            <span class="length">Длина: {{ item.length }}</span>
          </div>
        </div>
        <button class="delete-btn" (click)="deletePassword(item.id)">Удалить</button>
      </div>
    </div>
  </div>
</div>
